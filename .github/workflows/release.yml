# Pushing a v* tag publishes normal binaries and full offline archives as assets.
name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The full archive must contain the weight files used by BOTH model
      # dependent configurations: the legacy custom+aikit English cross-encoder,
      # and the pro tier's multilingual e5 embedder (which also powers local
      # MaxSim reranking). Layout under model/rembed/ matches rembed's cache so
      # the bundled directory can be used with zero network access.
      - name: Download offline models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(-fL --retry 3)
          if [ -n "${HF_TOKEN:-}" ]; then ARGS+=(-H "Authorization: Bearer ${HF_TOKEN}"); fi
          fetch() {
            local repo=$1 rev=$2 dst=$3
            shift 3
            for f in "$@"; do
              mkdir -p "$dst/$(dirname "$f")"
              curl "${ARGS[@]}" "https://huggingface.co/$repo/resolve/$rev/$f" -o "$dst/$f"
            done
          }
          LEGACY=cross-encoder/ms-marco-MiniLM-L-6-v2
          LEGACY_REV=233902d25c440f23af6f7d6e94d2946bac0bee0a
          fetch "$LEGACY" "$LEGACY_REV" "$RUNNER_TEMP/model/$LEGACY" \
            config.json model.safetensors tokenizer.json tokenizer_config.json vocab.txt
          PRO=intfloat/multilingual-e5-small
          PRO_REV=614241f622f53c4eeff9890bdc4f31cfecc418b3
          fetch "$PRO" "$PRO_REV" "$RUNNER_TEMP/model/rembed/intfloat--multilingual-e5-small" \
            config.json tokenizer_config.json modules.json sentencepiece.bpe.model \
            model.safetensors 1_Pooling/config.json
          (cd "$RUNNER_TEMP/model" && sha256sum -c "$GITHUB_WORKSPACE/assets/model.sha256")
      - name: Build binaries and full archives
        run: |
          TAG="${GITHUB_REF_NAME}"
          LEGACY="$RUNNER_TEMP/model/cross-encoder/ms-marco-MiniLM-L-6-v2"
          PRO="$RUNNER_TEMP/model/rembed/intfloat--multilingual-e5-small"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=${TAG}" -o dist/kbcli-${TAG}-darwin-amd64 ./cmd/kbcli
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${TAG}" -o dist/kbcli-${TAG}-darwin-arm64 ./cmd/kbcli
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=${TAG}" -o dist/kbcli-${TAG}-linux-amd64 ./cmd/kbcli
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X main.version=${TAG}" -o dist/kbcli-${TAG}-linux-arm64 ./cmd/kbcli
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=${TAG}" -o dist/kbcli-${TAG}-windows-amd64.exe ./cmd/kbcli
          # Normal tier: the five raw binaries above are uploaded unchanged.
          STAGE="$RUNNER_TEMP/stage"
          stage_models() {
            local d=$1
            mkdir -p "$d/model/rembed"
            cp -R "$LEGACY" "$d/model/ms-marco-MiniLM-L-6-v2"
            cp -R "$PRO" "$d/model/rembed/intfloat--multilingual-e5-small"
          }
          for spec in "darwin amd64" "darwin arm64" "linux amd64" "linux arm64"; do
            set -- $spec
            os=$1; arch=$2
            d="$STAGE/kbcli-full-${TAG}-${os}-${arch}"
            mkdir -p "$d"
            cp "dist/kbcli-${TAG}-${os}-${arch}" "$d/kbcli"
            stage_models "$d"
            tar -czf "$GITHUB_WORKSPACE/dist/kbcli-full-${TAG}-${os}-${arch}.tar.gz" -C "$d" .
          done
          d="$STAGE/kbcli-full-${TAG}-windows-amd64"
          mkdir -p "$d"
          cp "dist/kbcli-${TAG}-windows-amd64.exe" "$d/kbcli.exe"
          stage_models "$d"
          (cd "$d" && zip -qr "$GITHUB_WORKSPACE/dist/kbcli-full-${TAG}-windows-amd64.zip" .)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=".github/release-notes/${TAG}.md"
          (cd dist && sha256sum kbcli-* > checksums.txt)
          # Prefer curated release notes checked into the repo. Releases without
          # a notes file fall back to GitHub-generated notes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then gh release edit "$TAG" --notes-file "$NOTES"; fi
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
